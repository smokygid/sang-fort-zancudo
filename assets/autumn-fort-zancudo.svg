 <path d="M0 35 30 0h160l38 35v55H0Z" fill="#263a30" stroke="#111d18" stroke-width="7"/>
 <path d="M48 5h48v34H25Zm60 0h52v34h-52Z" fill="#a5a58a" opacity=".45"/>
 <circle cx="45" cy="90" r="23" fill="#151b18" stroke="#77806c" stroke-width="7"/><circle cx="185" cy="90" r="23" fill="#151b18" stroke="#77806c" stroke-width="7"/>
 <path d="M80 0v-24h55v24" fill="#33483a" stroke="#111d18" stroke-width="6"/>
</g>
<!-- foreground leaves -->
<g fill="#d38a35" opacity=".95"><path d="M130 720q-28 -35 8 -54 7 34 27 35-12 34-35 19Z"/><path d="M360 700q-20 -32 12 -49 4 28 24 33-14 27-36 16Z"/><path d="M760 735q-24 -31 8 -52 9 27 27 31-11 29-35 21Z"/><path d="M1200 715q-20 -31 13 -48 5 28 25 33-14 26-38 15Z"/><path d="M1680 730q-27 -34 9 -54 8 30 28 34-12 31-37 20Z"/></g>
<rect x="70" y="68" width="470" height="4" fill="url(#gold)" opacity=".8"/>
<text x="70" y="112" fill="#f0d49a" font-family="Arial,sans-serif" font-size="23" letter-spacing="7">SAN ANDREAS NATIONAL GUARD</text>
<text x="70" y="160" fill="#fff0d5" font-family="Arial,sans-serif" font-size="15" letter-spacing="4" opacity=".8">FORT ZANCUDO • AUTUMN SEASON</text>
</svg>