<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 760" role="img" aria-labelledby="title desc">
<title id="title">Осінній Fort Zancudo — San Andreas National Guard</title>
<desc id="desc">Військова база Fort Zancudo восени: золоті та помаранчеві дерева, гірський горизонт, казарми, контрольна вежа та військова техніка.</desc>
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#263746"/><stop offset=".55" stop-color="#a66c43"/><stop offset="1" stop-color="#e0a45d"/></linearGradient>
 <linearGradient id="ground" x2="0" y2="1"><stop stop-color="#65543a"/><stop offset="1" stop-color="#18251f"/></linearGradient>
 <linearGradient id="building" x2="0" y2="1"><stop stop-color="#657064"/><stop offset="1" stop-color="#26352f"/></linearGradient>
 <linearGradient id="gold" x2="0" y2="1"><stop stop-color="#f4d58a"/><stop offset="1" stop-color="#a66d2e"/></linearGradient>
 <filter id="haze"><feGaussianBlur stdDeviation="22"/></filter>
 <g id="tree"><path d="M0 0v-115" stroke="#30291f" stroke-width="12"/><path d="M0 -130c-58 -5 -76 -55 -36 -80 -5 -48 57 -62 79 -22 48 6 48 66 10 84 4 39 -22 58 -53 18Z" fill="#a94f25"/><path d="M-20 -150c-35 -22 -18 -60 12 -65 22 -37 72 -12 65 23 36 25 9 69 -26 64Z" fill="#d58a36"/><path d="M-5 -185c-8 -28 26 -45 44 -23 27 0 30 33 8 45Z" fill="#e3b24f"/></g>
</defs>
<rect width="1800" height="760" fill="url(#sky)"/>
<circle cx="1390" cy="190" r="145" fill="#f5c77d" opacity=".22" filter="url(#haze)"/>
<circle cx="1390" cy="190" r="66" fill="#f6d39a" opacity=".48"/>
<path d="M0 420 190 300 330 390 520 250 700 410 900 285 1080 415 1280 260 1460 405 1640 280 1800 390V760H0Z" fill="#485149" opacity=".78"/>
<path d="M0 470 220 380 420 455 620 345 820 470 1030 360 1220 465 1440 345 1640 460 1800 390V760H0Z" fill="#354238"/>
<rect y="500" width="1800" height="260" fill="url(#ground)"/>
<path d="M0 610Q400 560 780 620T1800 590V760H0Z" fill="#263329"/>
<!-- distant autumn tree line -->
<g opacity=".95">
 <use href="#tree" x="70" y="620" transform="translate(70 620) scale(1.25)"/>
 <use href="#tree" x="0" y="0" transform="translate(230 650) scale(1.05)"/>
 <use href="#tree" x="0" y="0" transform="translate(1580 625) scale(1.25)"/>
 <use href="#tree" x="0" y="0" transform="translate(1710 660) scale(1.05)"/>
</g>
<!-- perimeter fence -->
<path d="M0 575H1800M0 610H1800" stroke="#1a241f" stroke-width="5" opacity=".85"/>
<path d="M90 550v95m130 -95v95m130 -95v95m130 -95v95m130 -95v95m130 -95v95m130 -95v95m130 -95v95m130 -95v95m130 -95v95m130 -95v95m130 -95v95m130 -95v95" stroke="#1a241f" stroke-width="4" opacity=".75"/>
<!-- barracks -->
<g>
 <path d="M520 510 700 420 895 510V650H520Z" fill="url(#building)" stroke="#18251f" stroke-width="8"/>
 <path d="M490 510 700 400 925 510Z" fill="#29362e" stroke="#18251f" stroke-width="8"/>
 <path d="M555 535h75v75h-75zm115 0h75v75h-75zm115 0h75v75h-75z" fill="#d89a50" opacity=".55"/>
 <path d="M555 630h290v20H555Z" fill="#17231d"/>
</g>
<!-- control tower -->
<g>
 <path d="M1120 650V330h115v320Z" fill="#34443b" stroke="#1c2923" stroke-width="8"/>
 <path d="M1095 345h165l-18 -85h-130Z" fill="#26372f" stroke="#18251f" stroke-width="8"/>
 <path d="M1110 300h135v42h-135Z" fill="#d9a05b" opacity=".5"/>
 <path d="M1100 260h155v-20h-155Z" fill="#202e27"/>
 <path d="M1140 375h75v70h-75z" fill="#e2b36d" opacity=".25"/>
 <path d="M1150 480h55v55h-55z" fill="#d99a4d" opacity=".35"/>
</g>
<!-- hangar -->
<path d="M1320 500 1470 420 1635 500V650H1320Z" fill="#39463b" stroke="#1d2a23" stroke-width="8"/>
<path d="M1295 500 1470 400 1660 500Z" fill="#26342c" stroke="#1d2a23" stroke-width="8"/>
<path d="M1380 535h180v115h-180z" fill="#18251f" stroke="#1b2922" stroke-width="6"/>
