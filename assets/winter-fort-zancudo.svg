<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 760" role="img" aria-labelledby="title desc">
<title id="title">Зимовий Fort Zancudo — San Andreas National Guard</title>
<desc id="desc">Нічна зимова військова база з засніженими горами, контрольною вежею, казармами, ялинками та військовою технікою.</desc>
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#071522"/><stop offset=".55" stop-color="#18334a"/><stop offset="1" stop-color="#0a1722"/></linearGradient>
 <linearGradient id="snow" x2="0" y2="1"><stop stop-color="#e4edf2"/><stop offset="1" stop-color="#718da2"/></linearGradient>
 <linearGradient id="glass" x2="0" y2="1"><stop stop-color="#b8d7e9"/><stop offset="1" stop-color="#20394c"/></linearGradient>
 <linearGradient id="gold" x2="0" y2="1"><stop stop-color="#f3d88b"/><stop offset="1" stop-color="#a8792d"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="12"/></filter>
 <pattern id="stars" width="170" height="110" patternUnits="userSpaceOnUse"><circle cx="17" cy="20" r="1.5" fill="#e9f5ff" opacity=".7"/><circle cx="88" cy="60" r="1" fill="#fff" opacity=".55"/><circle cx="145" cy="15" r="1.3" fill="#d9ebf7" opacity=".65"/></pattern>
</defs>
